<!DOCTYPE html>
<html lang="ja">

<head>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3590693564400665"
    crossorigin="anonymous"></script>


  <meta charset="utf-8" />
  <title>My Page - BatriTable</title>
  <meta name="description" content="BatriTable マイページ。セーブデータの管理ができます。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/game.css">
  <!-- 同じファビコン等（必要に応じて） -->
  <link href="/favicon.ico" rel="icon" sizes="any" />
  <link href="/favicon-32.png?v=3" rel="icon" sizes="32x32" type="image/png" />
  <link href="/favicon-16.png?v=3" rel="icon" sizes="16x16" type="image/png" />
  <link href="/apple-touch-icon.png?v=3" rel="apple-touch-icon" sizes="180x180" />
  <link href="/site.webmanifest" rel="manifest" />

  <style>
    :root {
      --header-h: 72px;
      --content-w: min(1100px, 92vw);
      --gap: 16px;
      --card-r: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
      overflow: auto !important; /* game.css の overflow: hidden を上書き */
    }

    main {
      width: var(--content-w);
      margin: 18px auto 64px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    section {
      background: #fff;
      border-radius: var(--card-r);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
      padding: 18px;
    }

    section h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      gap: var(--gap);
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {

      .grid.cols-2,
      .grid.cols-3 {
        grid-template-columns: 1fr;
      }
    }

    .kv {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e9eef3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #666;
      user-select: none;
      overflow: hidden;
      border: 2px solid #ddd;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item strong {
      font-size: 15px;
    }

    .small-btn {
      text-decoration: none;
      border: 1px solid #ddd;
      padding: .35rem .6rem;
      border-radius: 10px;
      color: #333;
      background: #fafafa;
      cursor: pointer;
      font-size: 13px;
    }
    .small-btn:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }

    .right a.small-btn {
      display: inline-block;
    }

    ul.plain {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    footer {
      width: var(--content-w);
      margin: 24px auto 40px;
      color: #777;
      font-size: 12px;
      text-align: center;
    }

    /* ▼スロット プレビュー用 */
    .thumbs {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      min-height: 44px;
      align-items: center;
      flex-wrap: wrap;
    }

    .thumbs img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .thumbs .empty {
      color: #999;
      font-size: 13px;
    }

    .thumbs .more {
      font-size: 12px;
      color: #555;
    }

    .count {
      font-size: 12px;
      color: #777;
      margin-left: 6px;
    }

    /* ▼ プレミアム */
    .premium-section {
      background: linear-gradient(135deg, #fdf6e3, #fff9ec);
      border: 1px solid #f0d68a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .premium-section.is-premium {
      background: linear-gradient(135deg, #eef0ff, #f5f0ff);
      border-color: #c4b5fd;
    }

    .premium-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .premium-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .premium-info .label {
      font-weight: 600;
      font-size: 15px;
    }

    .premium-since {
      font-size: 13px;
      color: #666;
    }

    .premium-hint {
      font-size: 12px;
      color: #999;
    }

    .btn-premium-register {
      border: 1px solid #7c3aed;
      background: #fff;
      color: #7c3aed;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background .2s, color .2s;
    }

    .btn-premium-register:hover:not(:disabled) {
      background: #7c3aed;
      color: #fff;
    }

    .btn-premium-register:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .slot-list {
      margin-top: 10px;
      display: none;
    }

    .thumbs-grid {
      display: grid;
      grid-template-columns: repeat(5, 80px);
      gap: 8px;
    }

    .thumbs-grid img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    /* ▼ モーダル内サムネ（index.html風の小さなカードタイル） */
    #card-list-grid {
      /* タイル幅を固定 → 画像が増減しても一定サイズで並ぶ */
      grid-template-columns: repeat(auto-fill, 120px);
      justify-content: flex-start;
      /* 余白時の左寄せ */
    }

    .ms-section-title {
      grid-column: 1 / -1;
      font-size: 16px;
      font-weight: 800;
      padding: 14px 4px 6px;
      border-bottom: 2px solid #eee;
      margin-top: 8px;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #card-list-grid .cl-item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 6px;
      background: #fff;
      position: relative;
      transition: transform 0.1s, background-color 0.1s;
      display: flex;
      flex-direction: column;
    }

    #card-list-grid .cl-item:hover {
      transform: scale(1.02);
      border-color: #aaa;
    }

    .cl-card-img-wrap {
      position: relative;
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
    }

    /* 背面表示 */
    #card-list-grid .cl-item.is-back .cl-card-img-wrap {
      background: #000;
      border: 1px solid #444;
    }
    #card-list-grid .cl-item.is-back img {
      visibility: hidden;
    }
    #card-list-grid .cl-item.is-back.has-back-img img {
      visibility: visible;
    }

    #card-list-grid .cl-item.flippable .cl-card-img-wrap:hover::after {
      content: '🔄 Flip';
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      background: rgba(255,255,255,0.85);
      color: #333;
      font-weight: 700;
      pointer-events: none;
    }

    #card-list-grid .cl-item.is-back.flippable .cl-card-img-wrap:hover::after {
      background: rgba(0,0,0,0.65);
      color: #fff;
    }

    #card-list-grid img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    .cl-item-actions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      width: 100%;
    }

    .cl-btn-change-img, .cl-btn-delete-card {
      flex: 1;
      padding: 4px 2px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      border: 1px solid #ddd;
      background: #fdfdfd;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cl-btn-change-img:hover {
      background: #f0f7ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .cl-btn-delete-card {
      border-color: #fed7d7;
      color: #e53e3e;
      background: #fffafa;
    }

    .cl-btn-delete-card:hover {
      background: #fee2e2;
      border-color: #f87171;
    }

    /* ▼ タブ */
    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 2px solid #eee;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab-btn:hover {
      color: #444;
    }
    .tab-btn.active {
      color: #222;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: #444;
      border-radius: 3px 3px 0 0;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* ▼ マイルームカード */
    .room-card {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .room-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .room-card-thumb {
      aspect-ratio: 16 / 9;
      background: #1a3f2b;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .room-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .room-card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .room-card-title {
      font-weight: 700;
      font-size: 16px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .room-card-meta {
      font-size: 12px;
      color: #666;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .room-card-stats {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
    .room-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .room-card-actions a, .room-card-actions button {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-enter {
      background: #444;
      color: #fff;
    }
    .btn-delete {
      background: #fff;
      color: #e53e3e;
      border: 1px solid #fed7d7;
    }
    .room-name-edit {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 6px;
      width: 100%;
      font-size: 14px;
    }
  </style>
</head>

  <script type="module">
    // ===== Firebase Auth を使って、ログイン済みのときだけ表示しつつ
    // マイページに表示名と Google の ID を反映する =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, deleteUser,
      setPersistence, browserLocalPersistence, updateProfile,
      GoogleAuthProvider, reauthenticateWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, query, limit, updateDoc, writeBatch,
      where, orderBy, deleteDoc, serverTimestamp, setDoc, addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
    import { getStorage, ref, getDownloadURL, uploadBytes } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";
    import { initI18n } from "./scripts/i18n.js";


    // index.html と同じ設定（そのまま再掲）
    const firebaseConfig = {
      apiKey: "AIzaSyCy-r6L1NgyHcqvsfpkyNPDJq9uMvv2CMM",
      authDomain: "cardgame-f484c.firebaseapp.com",
      projectId: "cardgame-f484c",
      storageBucket: "cardgame-f484c.firebasestorage.app",
      messagingSenderId: "248859224605",
      appId: "1:248859224605:web:1320093856bc1861c174f4"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // Storage の安全なダウンロードURL取得（必要な時だけ使用）
    async function storageDownloadURL(path) {
      if (!path) return '';
      try { return await getDownloadURL(ref(storage, path)); }
      catch (_) { return ''; }
    }
    const db = getFirestore(app);
    // index 側と同じく「LOCAL」永続化（タブを跨いでログイン状態を復元）
    await setPersistence(auth, browserLocalPersistence);

    const nameEl = document.getElementById('displayName');
    const avEl = document.getElementById('avatar');
    const premiumSection = document.getElementById('premium-section');
    const premiumInfo = document.getElementById('premium-info');
    const premiumBadgeInline = document.getElementById('premium-badge-inline');
    const authIndicator = document.getElementById('auth-indicator');

    // === Initialization ===
    initI18n();

    function updateAuthIndicator(user) {
      if (!authIndicator) return;
      if (!user || user.isAnonymous) {
        authIndicator.innerHTML = `<a href="./login.html" class="login-btn">ログイン</a>`;
      } else {
        const photo = user.photoURL;
        const name = user.displayName || user.email || 'Player';
        const initial = name.charAt(0).toUpperCase();
        authIndicator.innerHTML = `
          <a href="./mypage.html" class="avatar-btn" title="マイページへ">
            ${photo ? `<img src="${photo}" alt="Avatar">` : initial}
          </a>
        `;
      }
    }

    // ===== セーブデータ表示（サムネ&一覧） =====
    let CURRENT_UID = null;
    let IS_USER_PREMIUM = false;
    let currentMySetPage = 0; // 0..9 (0: 1..10, 1: 11..20, ..., 9: 91..100)
    const slPath = (slot) => `users/${CURRENT_UID}/saves/slot${slot}`;

    // ===== マイルーム表示 =====
    const myRoomListEl = document.getElementById('myRoomList');
    const myRoomEmptyEl = document.getElementById('myRoomEmpty');
    const myRoomCountEl = document.getElementById('my-room-count');

    async function refreshMyRooms() {
      if (!CURRENT_UID) return;
      
      try {
        // インデックスエラー回避のため、単純なクエリに変更
        const q = query(
          collection(db, 'rooms'),
          where('hostUid', '==', CURRENT_UID),
          limit(100)
        );
        
        const snap = await getDocs(q);
        
        // JS側でフィルタリングとソートを行う
        const rooms = snap.docs
          .map(docSnap => ({ id: docSnap.id, ...docSnap.data() }))
          .filter(d => d.roomClosed !== true)
          .sort((a, b) => {
            const timeA = a.updatedAt?.toMillis?.() || 0;
            const timeB = b.updatedAt?.toMillis?.() || 0;
            return timeB - timeA;
          })
          .slice(0, 20); // 上位20件を表示

    async function fetchSlotMeta(slot) {
      const snap = await getDoc(doc(db, slPath(slot)));
      const d = snap.exists() ? (snap.data() || {}) : {};
      return {
        count: d.count || 0,
        updatedAt: d.updatedAt?.toDate?.() || null,
        name: d.name || ''
      };
    }

    async function fetchSlotData(slot) {
      const col = collection(db, `${slPath(slot)}/cards`);
      const snap = await getDocs(col);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function fetchSlotThumbs(slot, max = 5) {
      const items = await fetchSlotData(slot);
      return items.map(d => d.imageUrl || d.fullUrl || '').filter(Boolean).slice(0, max);
    }

    function renderThumbs(el, urls, total) {
      el.innerHTML = '';
      if (total === 0) {
        el.innerHTML = '<span class="empty">空き</span>';
        return;

      urls.forEach(u => {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = u;
        el.appendChild(img);
      });
      if (total > urls.length) {
        const more = document.createElement('span');
        more.className = 'more';
        more.textContent = `+${total - urls.length}`;
        el.appendChild(more);
      }

    async function refreshSaveSlots() {
      const start = currentMySetPage * 10 + 1;
      const end = start + 9;
      const SLOTS = Array.from({ length: 10 }, (_, i) => start + i);

      updateMySetPaginationUI();
      renderSaveListSkeleton();

      for (const slot of SLOTS) {
        const { count, updatedAt, name } = await fetchSlotMeta(slot);
        const itemEl = document.querySelector(`#saveList li[data-slot="${slot}"]`);
        if (!itemEl) continue;

        const nEl = document.getElementById(`slot${slot}-name`);
        if (nEl) nEl.value = name || '';

        const cEl = document.getElementById(`slot${slot}-count`);
        const uEl = document.getElementById(`slot${slot}-updated`);
        const tEl = document.getElementById(`slot${slot}-thumbs`);
        const bEl = itemEl.querySelector('.slot-list-btn');
        const eEl = itemEl.querySelector('.slot-edit-btn');
        const dEl = itemEl.querySelector('.slot-delete-btn');

        if (count > 0) {
          if (cEl) cEl.textContent = `(${count}枚)`;
          if (uEl) uEl.textContent = `最終更新: ${updatedAt ? updatedAt.toLocaleString() : '-'}`;
          const urls = await fetchSlotThumbs(slot, 5);
          if (tEl) renderThumbs(tEl, urls, count);
          if (bEl) bEl.style.display = 'inline-block';
          if (eEl) eEl.style.display = 'inline-block';
          if (dEl) dEl.style.display = 'inline-block';
        } else {
          if (cEl) cEl.textContent = '(0枚)';
          if (uEl) uEl.textContent = '最終更新: -';
          if (tEl) renderThumbs(tEl, [], 0);
          if (bEl) bEl.style.display = 'none';
          if (eEl) eEl.style.display = 'inline-block';
          if (dEl) dEl.style.display = 'none';
        }
      }
    }

    async function deleteSlot(slot, btnElement) {
      if (!confirm(`マイセット${slot}のデータを削除しますか？`)) return;

      if (btnElement) {
        btnElement.disabled = true;
        btnElement.textContent = '削除中...';
      }

      try {
        const baseRef = doc(db, slPath(slot));
        const cardsCol = collection(db, `${slPath(slot)}/cards`);

        const q = query(cardsCol, limit(500));
        let currentSnap = await getDocs(q);
        while (!currentSnap.empty) {
          let b = writeBatch(db);
          currentSnap.docs.forEach(d => b.delete(d.ref));
          await b.commit();
          currentSnap = await getDocs(q);
        }

        const finalBatch = writeBatch(db);
        finalBatch.delete(baseRef);
        await finalBatch.commit();

        alert(`マイセット${slot}のデータを削除しました。`);
        await refreshSaveSlots();
      } catch (err) {
        console.error('Delete error', err);
        alert('削除に失敗しました。');
        if (btnElement) {
          btnElement.disabled = false;
          btnElement.textContent = '削除する';
        }
      }
    }

    function applyUser(u) {
      // 表示名は「メール > displayName > 'Player'」の優先順

      }
    }

    // ===== アイコン変更（拡大縮小・位置ずらしクロップ機能付き） =====
    let cropImg = null;
    let cropBaseScale = 1.0;
    let cropZoom = 1.0;
    let cropOffsetX = 0;
    let cropOffsetY = 0;
    const CROP_VIEW_SIZE = 280;

    const cropModal = document.getElementById('avatar-crop-modal');
    const cropCanvas = document.getElementById('avatar-crop-canvas');
    const cropCtx = cropCanvas?.getContext('2d');
    const cropContainer = document.getElementById('avatar-crop-container');
    const zoomSlider = document.getElementById('avatar-zoom-slider');

    function renderCropCanvas() {
      if (!cropCtx || !cropImg) return;
      cropCtx.clearRect(0, 0, CROP_VIEW_SIZE, CROP_VIEW_SIZE);

      const currentScale = cropBaseScale * cropZoom;
      const drawW = cropImg.naturalWidth * currentScale;
      const drawH = cropImg.naturalHeight * currentScale;
      const drawX = (CROP_VIEW_SIZE - drawW) / 2 + cropOffsetX;
      const drawY = (CROP_VIEW_SIZE - drawH) / 2 + cropOffsetY;

      cropCtx.drawImage(cropImg, drawX, drawY, drawW, drawH);
    }

    function openCropModal(imgElement) {
      cropImg = imgElement;
      cropBaseScale = Math.max(CROP_VIEW_SIZE / cropImg.naturalWidth, CROP_VIEW_SIZE / cropImg.naturalHeight);
      cropZoom = 1.0;
      cropOffsetX = 0;
      cropOffsetY = 0;

      if (zoomSlider) {
        zoomSlider.value = '1';
      }
      if (cropModal) {
        cropModal.style.display = 'flex';
      }
      renderCropCanvas();
    }

    function closeCropModal() {
      if (cropModal) cropModal.style.display = 'none';
      cropImg = null;
    }

    // ドラッグ操作（マウス / タッチ共通 Pointer Events）
    let isCropDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartOffsetX = 0;
    let dragStartOffsetY = 0;

    cropContainer?.addEventListener('pointerdown', (e) => {
      if (!cropImg) return;
      isCropDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartOffsetX = cropOffsetX;
      dragStartOffsetY = cropOffsetY;
      cropContainer.style.cursor = 'grabbing';
      cropContainer.setPointerCapture(e.pointerId);
    });

    cropContainer?.addEventListener('pointermove', (e) => {
      if (!isCropDragging) return;
      cropOffsetX = dragStartOffsetX + (e.clientX - dragStartX);
      cropOffsetY = dragStartOffsetY + (e.clientY - dragStartY);
      renderCropCanvas();
    });

    const stopCropDrag = () => {
      isCropDragging = false;
      if (cropContainer) cropContainer.style.cursor = 'grab';
    };
    cropContainer?.addEventListener('pointerup', stopCropDrag);
    cropContainer?.addEventListener('pointercancel', stopCropDrag);

    // スライダーズーム
    zoomSlider?.addEventListener('input', () => {
      cropZoom = parseFloat(zoomSlider.value) || 1.0;
      renderCropCanvas();
    });

    // マウスホイールズーム
    cropContainer?.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.05 : -0.05;
      let nextZoom = Math.min(3.0, Math.max(1.0, cropZoom + delta));
      cropZoom = nextZoom;
      if (zoomSlider) zoomSlider.value = String(cropZoom);
      renderCropCanvas();
    }, { passive: false });

    // モーダルの閉じる・キャンセル
    document.getElementById('avatar-crop-close')?.addEventListener('click', closeCropModal);
    document.getElementById('avatar-crop-cancel')?.addEventListener('click', closeCropModal);
    cropModal?.addEventListener('click', (e) => {
      if (e.target === cropModal) closeCropModal();
    });

    // 「アイコンを変更」ボタン：ファイル選択を起動
    document.getElementById('changeAvatarBtn')?.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            openCropModal(img);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });

    // 「適用する」ボタン：Canvasで切り抜いてFirebase Storageにアップロード
    document.getElementById('avatar-crop-apply')?.addEventListener('click', async () => {
      if (!cropImg) return;

      const applyBtn = document.getElementById('avatar-crop-apply');
      if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.textContent = '保存中…';
      }

      try {
        const uid = auth.currentUser?.uid;
        if (!uid) throw new Error('Not logged in');

        // 512x512 の高解像度出力Canvasを作成
        const OUT_SIZE = 512;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = OUT_SIZE;
        outCanvas.height = OUT_SIZE;
        const outCtx = outCanvas.getContext('2d');

        // 丸型にクリップして切り抜く（透明PNG出力）
        outCtx.beginPath();
        outCtx.arc(OUT_SIZE / 2, OUT_SIZE / 2, OUT_SIZE / 2, 0, Math.PI * 2);
        outCtx.closePath();
        outCtx.clip();

        const currentScale = cropBaseScale * cropZoom;
        const ratio = OUT_SIZE / CROP_VIEW_SIZE;
        const drawW = cropImg.naturalWidth * currentScale * ratio;
        const drawH = cropImg.naturalHeight * currentScale * ratio;
        const drawX = ((CROP_VIEW_SIZE - cropImg.naturalWidth * currentScale) / 2 + cropOffsetX) * ratio;
        const drawY = ((CROP_VIEW_SIZE - cropImg.naturalHeight * currentScale) / 2 + cropOffsetY) * ratio;

        outCtx.drawImage(cropImg, drawX, drawY, drawW, drawH);

        // Blob化してStorageへアップロード
        const blob = await new Promise((resolve) => outCanvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('Failed to generate image blob');

        const storagePath = `users/${uid}/avatar_${Date.now()}.png`;
        const sref = ref(storage, storagePath);
        await uploadBytes(sref, blob);
        const downloadUrl = await getDownloadURL(sref);

        // Firebase Auth のプロフィール更新
        await updateProfile(auth.currentUser, { photoURL: downloadUrl });

        // Firestore のユーザードキュメントにも反映
        await setDoc(doc(db, `users/${uid}`), {
          photoURL: downloadUrl,
          updatedAt: serverTimestamp()
        }, { merge: true });

        // 画面に即時反映
        if (avEl) avEl.innerHTML = `<img src="${downloadUrl}" alt="Avatar">`;
        updateAuthIndicator(auth.currentUser);

        closeCropModal();
        alert('アイコンを更新しました！');
      } catch (err) {
        console.error('Apply avatar crop failed:', err);
        alert('アイコンの保存に失敗しました。');
      } finally {
        if (applyBtn) {
          applyBtn.disabled = false;
          applyBtn.textContent = '適用する';
        }
      }
    });

    // ===== プレミアムステータス表示 =====

          premiumInfo.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
              <button class="btn-premium-register" id="btn-premium-register" style="background:linear-gradient(135deg, #7c3aed, #a855f7); color:#fff; border:none; padding:10px 22px; border-radius:8px; font-weight:800; cursor:pointer; font-size:14px; box-shadow:0 4px 12px rgba(124,58,237,0.3);">
                ✨ プレミアムに登録（月額 500 円）
              </button>
              <span class="premium-hint" style="font-size:13px; color:#666;">ルーム上限100部屋、画像20MBなど特別な機能が使えます。<a href="./plans.html" style="color: #7c3aed; text-decoration: underline; margin-left:4px; font-weight:600;">プラン詳細はこちら</a></span>
            </div>
          `;

          document.getElementById('btn-premium-register').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;
            const oldText = btn.textContent;
            btn.textContent = '決済画面へ移動中...';
            try {
              const idToken = await auth.currentUser.getIdToken();
              const res = await fetch('/api/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken })
              });
              const data = await res.json();
              if (data.url) {
                window.location.href = data.url;
              } else {
                alert('エラーが発生しました: ' + (data.error || '不明なエラー'));
                btn.disabled = false;
                btn.textContent = oldText;
              }
            } catch (e) {
              console.error(e);
              alert('通信エラーが発生しました。');
              btn.disabled = false;
              btn.textContent = oldText;
            }
          });
        }
      } catch (e) {
        console.warn('[mypage] premium check failed:', e);
        premiumInfo.innerHTML = '<span class="muted">取得できませんでした</span>';
      }
    }

    onAuthStateChanged(auth, (user) => {
      // 未ログイン or 匿名ログインなら index に戻す
      if (!user || user.isAnonymous) {
        alert('マイページはログインが必要です。');
        location.href = './index.html';
        return;
      }
      CURRENT_UID = user.uid;
      applyUser(user);
      updateAuthIndicator(user);
      // ログイン済みになったら情報を描画
      refreshSaveSlots().catch(console.error);
      refreshMyRooms().catch(console.error);
      // プレミアムステータスを取得・表示
      renderPremiumUI(user.uid).catch(console.error);

      // 決済完了リダイレクト直後の判定
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('session_id')) {
        window.history.replaceState({}, document.title, window.location.pathname);
        alert('✨ プレミアム会員へのご登録ありがとうございます！\nプレミアム機能が有効化されました。');
        setTimeout(() => renderPremiumUI(user.uid), 2000);
      }
    });


    // ▼ スロット画像を「カード一覧 / 編集」モーダルで表示
    let CURRENT_MODAL_SLOT = null;
    let CURRENT_MODAL_MODE = 'view';

    async function openSlotModal(slot, mode = 'view') {
      CURRENT_MODAL_SLOT = slot;
      CURRENT_MODAL_MODE = mode;

      const modal = document.getElementById('card-list-modal');
      const grid = document.getElementById('card-list-grid');
      const title = document.getElementById('card-list-title');
      const footer = document.getElementById('card-list-footer');
      const footerInfo = document.getElementById('card-list-footer-info');
      const editBtn = document.getElementById('card-list-edit');
      const delBtn = document.getElementById('card-list-delete');

      if (!modal || !grid || !title) return;

      title.textContent = (mode === 'edit') ? `マイセット${slot}の編集` : `マイセット${slot}の一覧`;
      if (footer) footer.style.display = (mode === 'edit') ? 'flex' : 'none';
      if (footerInfo) footerInfo.textContent = '';

      if (editBtn) {
        editBtn.style.display = (mode === 'view') ? 'inline-block' : 'none';
        editBtn.dataset.slot = slot;
      }
      if (delBtn) {
        delBtn.style.display = 'inline-block';
        delBtn.dataset.slot = slot;
      }

      modal.style.display = 'flex';
      grid.innerHTML = '<div class="muted">読み込み中…</div>';

      try {
        const items = await fetchSlotData(slot);
        grid.innerHTML = '';
        if (items.length === 0) {
          grid.innerHTML = '<div class="muted" style="padding:24px; text-align:center;">アイテムはありません。下の「＋ カード追加」から追加できます。</div>';
          return;
        }

        // カテゴライズ
        const boards = items.filter(d => d.type === 'board');
        const cards = items.filter(d => !d.type || d.type === 'card');
        const tokens = items.filter(d => d.type === 'image-token' || d.type === 'token');

        const addSection = (label, list) => {
          if (list.length === 0) return;
          const sec = document.createElement('div');
          sec.className = 'ms-section-title';
          sec.textContent = `${label} (${list.length})`;
          grid.appendChild(sec);

          list.forEach(d => {
            const item = document.createElement('div');
            item.className = 'cl-item';
            item.dataset.id = d.id;
            if (d.type === 'card' || !d.type) item.classList.add('flippable');

            const imgWrap = document.createElement('div');
            imgWrap.className = 'cl-card-img-wrap';

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.decoding = 'async';
            img.alt = 'アイテム';
            img.src = d.imageUrl || d.fullUrl || '';
            imgWrap.appendChild(img);
            item.appendChild(imgWrap);

            // カード反転
            if (d.type === 'card' || !d.type) {
              imgWrap.addEventListener('click', (e) => {
                e.stopPropagation();
                const front = d.imageUrl || d.fullUrl || '';
                const back = d.backImageUrl || '';

                if (item.classList.toggle('is-back')) {
                  // 裏にする
                  if (back) {
                    img.src = back;
                    item.classList.add('has-back-img');
                  } else {
                    item.classList.remove('has-back-img');
                  }
                } else {
                  // 表にする
                  img.src = front;
                }
              });
            }

            // 編集モード時のアクションボタン
            if (mode === 'edit') {
              const actions = document.createElement('div');
              actions.className = 'cl-item-actions';

              const changeBtn = document.createElement('button');
              changeBtn.type = 'button';
              changeBtn.className = 'cl-btn-change-img';
              changeBtn.textContent = '画像変更';
              changeBtn.title = '現在表示されている面（表/裏）の画像を変更';
              changeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isBack = item.classList.contains('is-back');
                triggerChangeCardImage(slot, d.id, isBack, item, img, d);
              });

              const deleteCardBtn = document.createElement('button');
              deleteCardBtn.type = 'button';
              deleteCardBtn.className = 'cl-btn-delete-card';
              deleteCardBtn.textContent = '削除';
              deleteCardBtn.title = 'このカードを削除';
              deleteCardBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                triggerDeleteCard(slot, d.id, item);
              });

              actions.appendChild(changeBtn);
              actions.appendChild(deleteCardBtn);
              item.appendChild(actions);
            }

            grid.appendChild(item);
          });
        };

        addSection('🗺️ ボード', boards);
        addSection('🎴 カード', cards);
        addSection('♟️ コマ・トークン', tokens);

      } catch (_e) {
        console.error(_e);
        grid.innerHTML = '<div class="muted">取得に失敗しました</div>';
      }
    }

    // ▼ カード画像変更処理
    function triggerChangeCardImage(slot, cardId, isBack, itemEl, imgEl, dataObj) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files?.[0];
        if (!file) return;

        const changeBtn = itemEl.querySelector('.cl-btn-change-img');
        if (changeBtn) {
          changeBtn.disabled = true;
          changeBtn.textContent = '変更中…';
        }

        try {
          const extMatch = file.name.match(/\.[0-9a-z]+$/i);
          const ext = extMatch ? extMatch[0].toLowerCase() : '.jpg';
          const side = isBack ? 'back' : 'front';
          const storagePath = `users/${CURRENT_UID}/saves/slot${slot}/cards/${cardId}_${side}_${Date.now()}${ext}`;
          const sref = ref(storage, storagePath);
          await uploadBytes(sref, file);
          const url = await getDownloadURL(sref);

          const cardRef = doc(db, `${slPath(slot)}/cards/${cardId}`);
          if (isBack) {
            await updateDoc(cardRef, { backImageUrl: url, updatedAt: serverTimestamp() });
            dataObj.backImageUrl = url;
            imgEl.src = url;
            itemEl.classList.add('has-back-img');
          } else {
            await updateDoc(cardRef, { fullUrl: url, imageUrl: url, updatedAt: serverTimestamp() });
            dataObj.fullUrl = url;
            dataObj.imageUrl = url;
            imgEl.src = url;
          }

          await setDoc(doc(db, slPath(slot)), { updatedAt: serverTimestamp() }, { merge: true });
          refreshSaveSlots().catch(console.error);
        } catch (err) {
          console.error('Change card image failed', err);
          alert('画像の変更に失敗しました');
        } finally {
          if (changeBtn) {
            changeBtn.disabled = false;
            changeBtn.textContent = '画像変更';
          }
        }
      };
      input.click();
    }

    // ▼ カード1枚削除処理
    async function triggerDeleteCard(slot, cardId, itemEl) {
      if (!confirm('このカードを削除しますか？')) return;

      const delBtn = itemEl.querySelector('.cl-btn-delete-card');
      if (delBtn) {
        delBtn.disabled = true;
        delBtn.textContent = '削除中…';
      }

      try {
        const cardRef = doc(db, `${slPath(slot)}/cards/${cardId}`);
        await deleteDoc(cardRef);

        const slotRef = doc(db, slPath(slot));
        const snap = await getDoc(slotRef);
        const curr = snap.exists() ? (snap.data().count || 0) : 0;
        const nextCount = Math.max(0, curr - 1);
        await setDoc(slotRef, { count: nextCount, updatedAt: serverTimestamp() }, { merge: true });

        itemEl.remove();

        const grid = document.getElementById('card-list-grid');
        if (grid && !grid.querySelector('.cl-item')) {
          grid.innerHTML = '<div class="muted" style="padding:24px; text-align:center;">アイテムはありません。下の「＋ カード追加」から追加できます。</div>';
        }

        refreshSaveSlots().catch(console.error);
      } catch (err) {
        console.error('Delete card failed', err);
        alert('カードの削除に失敗しました');
        if (delBtn) {
          delBtn.disabled = false;
          delBtn.textContent = '削除';
        }
      }
    }

    // ▼ 「カード追加」ボタン処理
    document.getElementById('card-add-btn')?.addEventListener('click', () => {
      const input = document.getElementById('card-add-input');
      if (input) {
        input.value = '';
        input.click();
      }
    });

    document.getElementById('card-add-input')?.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0 || !CURRENT_MODAL_SLOT) return;

      const addBtn = document.getElementById('card-add-btn');
      const infoEl = document.getElementById('card-list-footer-info');

      if (addBtn) addBtn.disabled = true;
      if (infoEl) infoEl.textContent = `カードを追加中 (0/${files.length})...`;

      try {
        let addedCount = 0;
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          if (infoEl) infoEl.textContent = `カードを追加中 (${i + 1}/${files.length})...`;

          const extMatch = file.name.match(/\.[0-9a-z]+$/i);
          const ext = extMatch ? extMatch[0].toLowerCase() : '.jpg';

          const newCardRef = doc(collection(db, `${slPath(CURRENT_MODAL_SLOT)}/cards`));
          const cardId = newCardRef.id;

          const storagePath = `users/${CURRENT_UID}/saves/slot${CURRENT_MODAL_SLOT}/cards/${cardId}_${Date.now()}${ext}`;
          const sref = ref(storage, storagePath);
          await uploadBytes(sref, file);
          const url = await getDownloadURL(sref);

          await setDoc(newCardRef, {
            type: 'card',
            imageUrl: url,
            fullUrl: url,
            backImageUrl: '',
            faceUp: true,
            zIndex: 1,
            rotation: 0,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          addedCount++;
        }

        const slotRef = doc(db, slPath(CURRENT_MODAL_SLOT));
        const snap = await getDoc(slotRef);
        const curr = snap.exists() ? (snap.data().count || 0) : 0;
        await setDoc(slotRef, {
          count: curr + addedCount,
          updatedAt: serverTimestamp()
        }, { merge: true });

        if (infoEl) infoEl.textContent = `${addedCount}枚のカードを追加しました！`;
        setTimeout(() => { if (infoEl) infoEl.textContent = ''; }, 3000);

        await openSlotModal(CURRENT_MODAL_SLOT, 'edit');
        refreshSaveSlots().catch(console.error);

      } catch (err) {
        console.error('Add cards failed', err);
        alert('カードの追加に失敗しました');
        if (infoEl) infoEl.textContent = '追加エラー';
      } finally {
        if (addBtn) addBtn.disabled = false;
      }
    });


    // モーダルの閉じる・削除挙動（イベント委譲：要素が後で挿入されてもOK）
    document.addEventListener('click', async (e) => {
      const t = e.target;
      if (!(t instanceof HTMLElement)) return;
      // 「閉じる」ボタン
      if (t.id === 'card-list-close') {
        const m = document.getElementById('card-list-modal');
        if (m) m.style.display = 'none';
      }
      // 「編集」ボタン（モーダルヘッダー内）
      if (t.id === 'card-list-edit') {
        const slot = parseInt(t.dataset.slot, 10);
        if (slot) openSlotModal(slot, 'edit');
      }
      // 「削除」ボタン（モーダル内）
      if (t.id === 'card-list-delete') {
        const slot = parseInt(t.dataset.slot, 10);
        if (slot) {
          await deleteSlot(slot, t);
          const m = document.getElementById('card-list-modal');
          if (m) m.style.display = 'none'; // 削除終わったらモーダルは閉じる
        }
      }
      // 背景クリックで閉じる
      if (t.id === 'card-list-modal') {
        t.style.display = 'none';
      }
    });

    // ===== タブ切り替え =====
    document.getElementById('myTabs')?.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      
      // ボタンのアクティブ状態を更新
      document.querySelectorAll('#myTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // コンテンツの表示・非表示を切り替え
      const targetId = btn.dataset.target;
      document.querySelectorAll('.tab-content').forEach(c => {
        if (c.id === targetId) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });
    });

    // ログアウト
    document.getElementById('logout-btn-mypage')?.addEventListener('click', async () => {
      try {
        await auth.signOut();
        location.href = './lobby.html';
      } catch (e) {
        console.error('Logout failed:', e);
      }
    });

    // アカウント削除 (Backend APIを利用して一括削除)
    document.getElementById('btn-delete-account')?.addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return;
      
      const { t, getLang } = await import("./scripts/i18n.js");
      const lang = getLang();
      
      // 意志の最終確認
      if (!confirm(t('mypage.deleteConfirm'))) return;
      
      const btn = document.getElementById('btn-delete-account');
      if (btn) {
        btn.disabled = true;
        btn.textContent = (lang === 'ja' ? 'アカウント削除中...' : 'Deleting account...');
      }

      try {
        // IDトークンを取得してバックエンドに送信
        const idToken = await user.getIdToken(true);
        const res = await fetch('/api/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Deletion failed');
        }

        // 成功したらクライアント側でもログアウト
        await auth.signOut();
        
        alert(t('mypage.deleteSuccess'));
        // ログアウト後は匿名ユーザーとしてロビーへ
        location.href = './lobby.html';
      } catch (e) {
        console.error('Account deletion failed:', e);
        alert((t('mypage.deleteAccountBtn') + ' failed: ') + (e.message || 'Unknown error'));
        if (btn) {
          btn.disabled = false;
          btn.textContent = t('mypage.deleteAccountBtn');
        }
      }
    });

  </script>


  <!-- ▼ index.html と同じ見た目の「カード一覧」モーダルを追加 -->
  <div id="card-list-modal" role="dialog" aria-modal="true"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:center; justify-content:center; z-index:10000;">
    <div id="card-list-sheet"
      style="width:min(920px, 92vw); max-height:80vh; background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); overflow:hidden; display:flex; flex-direction:column;">
      <div id="card-list-header"
        style="padding:10px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee;">
        <div id="card-list-title" style="font-weight:700; font-size:16px;">一覧</div>
        <div style="display:flex; gap:8px;">
          <button id="card-list-edit" type="button"
            style="display:none; border:1px solid #93c5fd; background:#f0f7ff; color:#1d4ed8; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;"
            data-slot="">編集</button>
          <button id="card-list-delete" type="button"
            style="display:none; border:1px solid #fed7d7; background:#fffafa; color:#e53e3e; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;"
            data-slot="">削除</button>
          <button id="card-list-close" type="button"
            style="border:0; background:#eee; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;">閉じる</button>
        </div>
      </div>
      <div id="card-list-body" style="padding:16px; overflow:auto; flex:1;">
        <div id="card-list-grid" style="display:grid; gap:10px;"></div>
      </div>
      <!-- ▼ 編集用フッターバー -->
      <div id="card-list-footer"
        style="display:none; padding:12px 16px; border-top:1px solid #eee; background:#f9fafb; align-items:center; justify-content:space-between; gap:12px;">
        <div id="card-list-footer-info" style="font-size:13px; color:#666;"></div>
        <div>
          <input type="file" id="card-add-input" accept="image/*" multiple style="display:none;">
          <button id="card-add-btn" type="button"
            style="background:#2563eb; color:#fff; border:none; padding:8px 18px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(37,99,235,0.25);">
            <span style="font-size:16px;">➕</span> カード追加
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ▼ アイコン切り抜き（クロップ）モーダル -->
  <div id="avatar-crop-modal" role="dialog" aria-modal="true"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); align-items:center; justify-content:center; z-index:10001;">
    <div id="avatar-crop-sheet"
      style="width:min(380px, 92vw); background:#fff; border-radius:16px; box-shadow:0 12px 36px rgba(0,0,0,.4); overflow:hidden; display:flex; flex-direction:column;">
      <div style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee;">
        <div style="font-weight:700; font-size:16px;">アイコンの調整</div>
        <button id="avatar-crop-close" type="button"
          style="border:0; background:none; font-size:22px; color:#888; cursor:pointer; padding:0 4px; line-height:1;">✕</button>
      </div>
      <div style="padding:20px; display:flex; flex-direction:column; align-items:center; gap:16px;">
        <!-- クロップ表示エリア (280x280) -->
        <div id="avatar-crop-container"
          style="width:280px; height:280px; position:relative; overflow:hidden; background:#18181b; border-radius:12px; cursor:grab; touch-action:none; user-select:none;">
          <canvas id="avatar-crop-canvas" width="280" height="280" style="display:block; width:100%; height:100%;"></canvas>
          <!-- 丸いオーバーレイマスク（中央の円が透明、周囲が暗い半透明） -->
          <div style="position:absolute; inset:0; pointer-events:none; border-radius:50%; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55), inset 0 0 0 2px rgba(255,255,255,0.9);"></div>
        </div>

        <!-- ズームスライダー -->
        <div style="width:100%; max-width:280px; display:flex; align-items:center; gap:10px;">
          <span style="font-size:14px; color:#777; user-select:none;">🔍-</span>
          <input type="range" id="avatar-zoom-slider" min="1" max="3" step="0.01" value="1"
            style="flex:1; cursor:pointer; accent-color:#2563eb;">
          <span style="font-size:14px; color:#777; user-select:none;">🔍+</span>
        </div>
      </div>
      <div style="padding:12px 18px; border-top:1px solid #eee; background:#f9fafb; display:flex; justify-content:flex-end; gap:10px;">
        <button id="avatar-crop-cancel" type="button"
          style="border:1px solid #ddd; background:#fff; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; color:#555;">キャンセル</button>
        <button id="avatar-crop-apply" type="button"
          style="border:none; background:#2563eb; color:#fff; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:700; box-shadow:0 2px 6px rgba(37,99,235,0.3);">適用する</button>
      </div>
    </div>
  </div>
