<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>ログイン — BatriTable</title>

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon" sizes="any" />
    <link href="/favicon-32.png?v=1" rel="icon" sizes="32x32" type="image/png" />
    <link href="/apple-touch-icon.png?v=1" rel="apple-touch-icon" sizes="180x180" />
    <link href="/site.webmanifest" rel="manifest" />

    <meta name="description" content="BatriTableにログイン。メールアドレスまたはGoogleアカウントでサインインできます。" />
    <meta name="robots" content="noindex, nofollow" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: min(440px, 92vw);
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
            padding: 32px 28px;
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #ccc;
            margin: 20px 0 8px;
            text-align: left;
        }

        .login-field {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            transition: border-color .2s;
        }

        .login-field::placeholder {
            color: #666;
        }

        .login-field:focus {
            border-color: #0a7;
            box-shadow: 0 0 0 2px rgba(0, 170, 119, .2);
        }

        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s ease;
            margin-bottom: 8px;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .login-btn--primary {
            background: #e94560;
            color: #fff;
        }

        .login-btn--primary:hover:not(:disabled) {
            background: #c73850;
        }

        .login-btn--google {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }

        .login-btn--google:hover:not(:disabled) {
            background: #f5f5f5;
        }

        .login-btn--register {
            background: transparent;
            color: #ccc;
            border: 1px solid #444;
        }

        .login-btn--register:hover:not(:disabled) {
            background: #1a1a2e;
            border-color: #666;
        }

        .forgot-link {
            display: block;
            font-size: 12px;
            color: #5cb8ff;
            text-decoration: none;
            margin: 4px 0 0;
            text-align: center;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid #333;
            margin: 20px 0;
        }

        .sns-section {
            margin-top: 16px;
        }

        .register-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #5cb8ff;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ログイン済みメッセージ */
        .loggedin-msg {
            font-size: 15px;
            color: #0a7;
            font-weight: 700;
            margin: 16px 0;
        }

        .lang-switch {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #16213e;
            color: #ccc;
        }
    </style>
</head>

<body>
    <select class="lang-switch" id="lang-switch" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>

    <div class="login-container">
        <!-- ロゴ -->
        <div class="login-logo">
            <span class="login-logo-text">B</span>
        </div>

        <div class="login-title">ログイン</div>
        <div class="login-subtitle" id="login-subtitle">
            ログインに失敗する場合は、ブラウザやセキュリティソフトの設定で<br>Cookieや通信がブロックされていないことをご確認ください。
        </div>

        <!-- ===== 未ログイン時：認証フォーム ===== -->
        <div id="auth-form-area">
            <!-- メール/パスワード -->
            <div class="section-label" id="lbl-email-section">メールアドレスでログインする</div>
            <input class="login-field" id="login-email" type="email" placeholder="メールアドレス" />
            <input class="login-field" id="login-password" type="password" placeholder="パスワード" />
            <button class="login-btn login-btn--primary" id="login-email-btn" type="button">ログイン</button>
            <a href="#" class="forgot-link" id="forgot-password-link">パスワードを忘れた場合</a>

            <!-- SNS認証 -->
            <div class="sns-section">
                <div class="section-label" id="lbl-sns-section">SNS認証でログインする</div>
                <button class="login-btn login-btn--google" id="login-google" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.97 10.97 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span id="lbl-google">Googleでログイン</span>
                </button>
            </div>

            <!-- 新規アカウント作成 -->
            <div class="register-section">
                <div class="section-label" id="lbl-no-account">アカウントをお持ちでない方</div>
                <button class="login-btn login-btn--register" id="register-btn" type="button">
                    <span id="lbl-register">新規アカウント作成</span>
                </button>
            </div>
        </div>

        <!-- ===== ログイン済み時 ===== -->
        <div id="auth-loggedin-area" style="display:none;">
            <div class="loggedin-msg" id="loggedin-msg">ログイン済みです</div>
            <div id="loggedin-user" style="color:#aaa; font-size:13px; margin-bottom:16px;"></div>
            <button class="login-btn login-btn--primary" onclick="location.href='./game.html'" id="btn-back-game">
                ゲームに戻る
            </button>
            <button class="login-btn login-btn--register" id="logout-btn" type="button" style="margin-top:8px;">
                ログアウト
            </button>
        </div>

        <a href="./game.html" class="back-link" id="back-link">← ゲームに戻る</a>
    </div>

    <script src="scripts/polyfills.js"></script>
    <script type="module">
        import {
            app, auth, db,
            signInAnonymously, onAuthStateChanged,
            GoogleAuthProvider, EmailAuthProvider,
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            sendPasswordResetEmail,
            signInWithPopup, linkWithPopup, signInWithCredential, linkWithCredential,
            signInWithRedirect, linkWithRedirect,
            signOut, updateProfile
        } from './scripts/firebase.init.js';

        // ===== DOM refs =====
        const authFormArea = document.getElementById('auth-form-area');
        const authLoggedinArea = document.getElementById('auth-loggedin-area');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');
        const loginEmailBtn = document.getElementById('login-email-btn');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const loginGoogleBtn = document.getElementById('login-google');
        const registerBtn = document.getElementById('register-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const loggedinUser = document.getElementById('loggedin-user');

        // ===== i18n (simple) =====
        const I18N = {
            ja: {
                title: 'ログイン',
                subtitle: 'ログインに失敗する場合は、ブラウザやセキュリティソフトの設定で<br>Cookieや通信がブロックされていないことをご確認ください。',
                emailSection: 'メールアドレスでログインする',
                emailPh: 'メールアドレス', passPh: 'パスワード',
                loginBtn: 'ログイン', forgot: 'パスワードを忘れた場合',
                snsSection: 'SNS認証でログインする', google: 'Googleでログイン',
                noAccount: 'アカウントをお持ちでない方', register: '新規アカウント作成',
                loggedIn: 'ログイン済みです', backGame: 'ゲームに戻る', logout: 'ログアウト',
                backLink: '← ゲームに戻る'
            },
            en: {
                title: 'Sign In',
                subtitle: 'If sign-in fails, check that cookies and network are not blocked by your browser or security software.',
                emailSection: 'Sign in with email',
                emailPh: 'Email address', passPh: 'Password',
                loginBtn: 'Sign in', forgot: 'Forgot your password?',
                snsSection: 'Sign in with SNS', google: 'Sign in with Google',
                noAccount: "Don't have an account?", register: 'Create new account',
                loggedIn: 'You are signed in', backGame: 'Back to game', logout: 'Sign out',
                backLink: '← Back to game'
            }
        };
        let lang = (localStorage.getItem('lang') || 'ja').toLowerCase();
        if (!['ja', 'en'].includes(lang)) lang = 'ja';
        const langSel = document.getElementById('lang-switch');
        langSel.value = lang;
        function applyLang() {
            const d = I18N[lang] || I18N.ja;
            document.querySelector('.login-title').textContent = d.title;
            document.getElementById('login-subtitle').innerHTML = d.subtitle;
            document.getElementById('lbl-email-section').textContent = d.emailSection;
            loginEmailInput.placeholder = d.emailPh;
            loginPasswordInput.placeholder = d.passPh;
            loginEmailBtn.textContent = d.loginBtn;
            forgotPasswordLink.textContent = d.forgot;
            document.getElementById('lbl-sns-section').textContent = d.snsSection;
            document.getElementById('lbl-google').textContent = d.google;
            document.getElementById('lbl-no-account').textContent = d.noAccount;
            document.getElementById('lbl-register').textContent = d.register;
            document.getElementById('loggedin-msg').textContent = d.loggedIn;
            document.getElementById('btn-back-game').textContent = d.backGame;
            logoutBtn.textContent = d.logout;
            document.getElementById('back-link').textContent = d.backLink;
        }
        applyLang();
        langSel.addEventListener('change', () => { lang = langSel.value; localStorage.setItem('lang', lang); applyLang(); });

        // ===== Auth state =====
        let __initial = false;
        onAuthStateChanged(auth, (user) => {
            if (!__initial) {
                __initial = true;
                if (!user) { signInAnonymously(auth).catch(console.error); return; }
            }
            if (!user) return;
            if (user.isAnonymous) {
                authFormArea.style.display = '';
                authLoggedinArea.style.display = 'none';
            } else {
                authFormArea.style.display = 'none';
                authLoggedinArea.style.display = '';
                loggedinUser.textContent = user.email || user.displayName || '';
            }
        });

        // ===== Email login =====
        loginEmailBtn.addEventListener('click', async () => {
            const email = loginEmailInput.value.trim();
            const password = loginPasswordInput.value.trim();
            if (!email || !password) { alert(lang === 'ja' ? 'メールアドレスとパスワードを入力してください。' : 'Please enter email and password.'); return; }
            try {
                loginEmailBtn.disabled = true;
                const u = auth.currentUser;
                if (u && u.isAnonymous) {
                    try {
                        await linkWithCredential(u, EmailAuthProvider.credential(email, password));
                        location.href = './game.html';
                        return;
                    } catch (e) {
                        if (e?.code === 'auth/email-already-in-use' || e?.code === 'auth/credential-already-in-use') {
                            await signInWithEmailAndPassword(auth, email, password);
                            location.href = './game.html';
                            return;
                        }
                        throw e;
                    }
                }
                await signInWithEmailAndPassword(auth, email, password);
                location.href = './game.html';
            } catch (e) {
                console.warn('[EmailSignIn]', e);
                const code = e?.code || '';
                if (code === 'auth/user-not-found' || code === 'auth/invalid-credential') alert(lang === 'ja' ? 'アカウントが見つからないか、パスワードが違います。' : 'Account not found or wrong password.');
                else if (code === 'auth/wrong-password') alert(lang === 'ja' ? 'パスワードが違います。' : 'Wrong password.');
                else if (code === 'auth/invalid-email') alert(lang === 'ja' ? 'メールアドレスの形式が正しくありません。' : 'Invalid email format.');
                else if (code === 'auth/too-many-requests') alert(lang === 'ja' ? 'ログイン試行回数が多すぎます。' : 'Too many attempts. Try later.');
                else alert(`${lang === 'ja' ? 'ログインに失敗しました' : 'Sign-in failed'} (${code})`);
            } finally { loginEmailBtn.disabled = false; }
        });

        // ===== Register =====
        registerBtn.addEventListener('click', async () => {
            const email = loginEmailInput.value.trim();
            const password = loginPasswordInput.value.trim();
            if (!email || !password) { alert(lang === 'ja' ? 'メールアドレスとパスワードを入力してください。' : 'Please enter email and password.'); return; }
            if (password.length < 6) { alert(lang === 'ja' ? 'パスワードは6文字以上で入力してください。' : 'Password must be at least 6 characters.'); return; }
            try {
                registerBtn.disabled = true;
                const u = auth.currentUser;
                if (u && u.isAnonymous) {
                    try {
                        await linkWithCredential(u, EmailAuthProvider.credential(email, password));
                        location.href = './game.html';
                        return;
                    } catch (e) {
                        if (e?.code === 'auth/email-already-in-use') { alert(lang === 'ja' ? 'このメールアドレスは既に登録されています。' : 'Email already in use.'); return; }
                        throw e;
                    }
                }
                await createUserWithEmailAndPassword(auth, email, password);
                location.href = './game.html';
            } catch (e) {
                console.warn('[Register]', e);
                const code = e?.code || '';
                if (code === 'auth/email-already-in-use') alert(lang === 'ja' ? 'このメールアドレスは既に登録されています。' : 'Email already in use.');
                else if (code === 'auth/weak-password') alert(lang === 'ja' ? 'パスワードが弱すぎます。' : 'Password too weak.');
                else if (code === 'auth/invalid-email') alert(lang === 'ja' ? 'メールアドレスの形式が正しくありません。' : 'Invalid email.');
                else alert(`${lang === 'ja' ? 'アカウント作成に失敗しました' : 'Registration failed'} (${code})`);
            } finally { registerBtn.disabled = false; }
        });

        // ===== Forgot password =====
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = loginEmailInput.value.trim();
            if (!email) { alert(lang === 'ja' ? 'メールアドレスを入力してから押してください。' : 'Enter your email first.'); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                alert(lang === 'ja' ? 'パスワードリセットメールを送信しました。' : 'Password reset email sent.');
            } catch (e2) {
                const code = e2?.code || '';
                if (code === 'auth/user-not-found' || code === 'auth/invalid-email') alert(lang === 'ja' ? 'アカウントが見つかりません。' : 'Account not found.');
                else alert(`${lang === 'ja' ? 'リセットに失敗しました' : 'Reset failed'} (${code})`);
            }
        });

        // ===== Google =====
        const google = new GoogleAuthProvider();
        loginGoogleBtn.addEventListener('click', async () => {
            try {
                loginGoogleBtn.disabled = true;
                const u = auth.currentUser;
                if (u && u.isAnonymous) {
                    try { await linkWithPopup(u, google); } catch (e) {
                        if (e?.code === 'auth/credential-already-in-use') {
                            const cred = GoogleAuthProvider.credentialFromError(e);
                            if (cred) await signInWithCredential(auth, cred);
                        } else if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e?.code)) {
                            await linkWithRedirect(u, google); return;
                        } else throw e;
                    }
                } else {
                    await signInWithPopup(auth, google);
                }
                location.href = './game.html';
            } catch (e) {
                console.warn('[GoogleSignIn]', e);
                alert(`${lang === 'ja' ? 'ログインに失敗しました' : 'Sign-in failed'} (${e?.code || 'unknown'})`);
            } finally { loginGoogleBtn.disabled = false; }
        });

        // ===== Logout =====
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                await signInAnonymously(auth);
            } catch (e) { console.warn(e); }
        });
    </script>
</body>

</html>
