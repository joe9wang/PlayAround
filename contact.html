  <style>
    :root {
      --gap: 16px;
      --radius: 14px;
      /* index.html と統一のカラーパレット */
      --purple: #b350be;
      --green: #3cd08e;
      --red: #e64a5a;
      --orange: #f79f27;
      --blue: #1e82e0;
      --ink: #0f172a;
      --bg: #f6f7fb;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto,
        "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
    }

    /* ====== ヘッダー ====== */
    .site-header {
      background: linear-gradient(135deg, var(--purple) 0%, #8e3a9b 100%);
      color: #fff;
      padding: 0 24px;
      box-shadow: 0 4px 20px rgba(164, 10, 179, .25);
      border-radius: var(--radius);
      margin: 16px 16px 0;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: .2px;
      color: #fff;
    }

    .nav {
      display: flex;
      gap: 6px;
      margin-left: 8px;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: saturate(140%) blur(2px);
      font-size: 0.9rem;
      font-weight: 600;
      transition: background .2s;
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .18)
    }

    .header-spacer {
      flex: 1;
    }

    .header-play-btn {
      font-size: 0.9rem !important;
      padding: 8px 20px !important;
      border-radius: 10px !important;
      flex-shrink: 0;
    }

    /* レイアウト（ヘッダー下） */
    .layout {
      min-height: calc(100dvh - 120px); /* ヘッダー分を考慮しつつ調整 */
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      gap: var(--gap);
      padding: var(--gap);
    }

    /* メイン */
    .hero {
      background: transparent;
      border-radius: var(--radius);
      padding: 0;
      margin: 0;
      color: var(--ink);
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    .hero h2 {
      margin: 0 0 12px;
      font-size: 1.9rem;
      color: #0b3b2b;
    }

    .hero p.lead {
      margin: 6px 0 22px;
      font-size: 1.05rem;
      color: #444;
    }

    .content-box {
      background: rgba(255, 255, 255, .92);
      border-radius: 12px;
      padding: 32px 42px;
      line-height: 1.82;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
      margin: 0;
    }

    .content-box > *:last-child {
      margin-bottom: 0 !important;
    }

    .content-box h3 {
      margin: 24px 0 12px;
      font-size: 1.25rem;
      color: #0b3b2b;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }

    .btn-mail {
      display: inline-block;
      padding: 14px 24px;
      margin: 18px 0;
      border-radius: 12px;
      background: #0b3b2b;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: opacity .2s;
    }

    .btn-mail:hover {
      opacity: 0.9;
    }

    /* レスポンシブ */
    @media (max-width: 1000px) {
      .header-inner {
        flex-wrap: wrap;
        height: auto;
        padding: 12px 0;
        gap: 10px;
      }

      .nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        gap: 6px;
        margin-left: 0;
        padding-bottom: 4px;
      }

      .nav a {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      .header-play-btn {
        margin-left: auto;
      }
    }
  </style>
</head>

<body>
  <!-- ヘッダー -->
  <div id="header-mount"></div>

  <div class="layout">

    <!-- メイン -->
    <main class="hero" role="main">
      <section class="content-box">
        <header>
          <h2>お問い合わせ</h2>
          <p class="lead">BatriTable へのご意見・ご要望・不具合報告は、以下よりお気軽にご連絡ください。<br>
            開発チームが確認し、必要に応じて数日以内に返信いたします。</p>
        </header>

        <p>お問い合わせメールアドレス：<a href="mailto:joe9bk@gmail.com">joe9bk@gmail.com</a></p>
        <a href="mailto:joe9bk@gmail.com" class="btn-mail">✉ メールで連絡する</a>

        <h3>開発チームより</h3>
        <p>BatriTable は「誰でも気軽に遊べる場」を目指して開発しています。<br>
          あなたの声が、サービスをもっと良くする力になります！</p>
        <p style="margin-top:28px;font-size:.95rem;color:#666;">
          ※ 内容によっては返信にお時間をいただく場合がございます。<br>
          ※ バグ報告の際は「再現手順」や「使用環境（PC/スマホ、ブラウザ名）」を添えていただけると助かります。
        </p>
      </section>
    </main>

    <!-- フッター -->
    <div id="footer-mount" style="grid-column: 1 / -1;"></div>

  </div>

  <script>
    (async () => {
      async function loadPartial(id, path) {
        const el = document.getElementById(id);
        if (!el) return;
        const tries = ["./partials/" + path, "/partials/" + path];
        for (const url of tries) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (res.ok) { el.innerHTML = await res.text(); return; }
          } catch (e) { }
        }
        console.warn(path + " が見つかりませんでした。");
      }
      loadPartial('header-mount', 'header.html');
      loadPartial('footer-mount', 'footer.html');
    })();
  </script>
</body>

</html>
