  <style>
    :root {
      --gap: 16px;
      --radius: 14px;
      /* BatriTable配色（添付イメージ準拠） */
      --purple: #b350be;
      /* 左の縦帯（少し柔らかい紫） */
      --green: #3cd08e;
      /* 中央の大きい面（やや落ち着いた緑） */
      --red: #e64a5a;
      /* 右上カード（鮮やかさ控えめの赤） */
      --orange: #f79f27;
      /* 右下カード（少し落ち着いたオレンジ） */
      --blue: #1e82e0;
      /* 下部の横帯（やや淡い青） */
      --ink: #0f172a;
      --bg: #f6f7fb;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", Meiryo, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .header-spacer {
      flex: 1;
    }

    .header-play-btn {
      font-size: 0.9rem !important;
      padding: 8px 20px !important;
      border-radius: 10px !important;
      flex-shrink: 0;
    }

    /* ====== グリッド全体 ====== */
    .layout {
      min-height: calc(100dvh - 80px);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      gap: var(--gap);
      padding: var(--gap);
    }

    /* 中央：ヒーロー（大きい緑の面） */
    .hero {
      grid-column: 1;
      grid-row: 1;
      background: linear-gradient(135deg, var(--green) 0%, #2fb078 100%);
      border-radius: var(--radius);
      padding: 40px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(39, 217, 138, .25);
      color: #e6fff4;
      /* 少し薄い緑のテキスト（読みやすさ向上） */
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 2rem
    }

    .hero p {
      margin: 0 0 24px;
      font-size: 1.05rem
    }

    .hero .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .06s ease, box-shadow .2s ease;
      letter-spacing: .3px;
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn-dark {
      background: #0b3b2b;
      color: #fff
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .22);
      color: #093a2a
    }

    .room {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .room input {
      padding: 12px 12px;
      border-radius: 12px;
      border: 0;
      min-width: 200px;
      background: rgba(255, 255, 255, .9);
    }

    /* 右：上下カード（赤／橙） */
    .right-sidebar {
      grid-column: 3;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .card {
      border-radius: var(--radius);
      padding: 22px;
      color: #fff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, .12);
      flex: 1;
      /* 等分にする */
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      margin: 0 0 8px
    }

    .right-top {
      background: linear-gradient(135deg, var(--red) 0%, #c43a48 100%);
    }

    .right-bottom {
      background: linear-gradient(135deg, var(--orange) 0%, #d98a1e 100%);
      color: #3d2600;
      justify-content: flex-start;
      /* コンテンツを上寄せにする */
    }

    /* 下：横帯（青） */
    .cta {
      grid-column: 1 / -1;
      grid-row: 2;
      background: var(--blue);
      color: #fff;
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 10px 24px rgba(13, 115, 232, .25);
    }

    .cta .cta-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .btn-white {
      background: #fff;
      color: #0d73e8
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      outline: 2px solid rgba(255, 255, 255, .8)
    }

    /* リンクの見た目統一 */
    a.btn {
      display: inline-block;
      text-decoration: none
    }


    /* 小さめ紫ボタン（CTA用） */
    .btn-play-small {
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      display: inline-flex;
      align-items: center;
      gap: .4em;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #b350be 0%, #702d85 50%, #b350be 100%);
      background-size: 220% 220%;
      box-shadow: 0 6px 16px rgba(112, 45, 133, .35);
      transition: transform .15s ease, box-shadow .35s ease, background-position .6s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-play-small:hover {
      transform: translateY(-1px);
      background-position: 100% 0;
      box-shadow: 0 10px 20px rgba(112, 45, 133, .45);
    }

    .btn-play-small:active {
      transform: translateY(0) scale(0.98)
    }

    .btn-play-small::after {
      content: "";
      position: absolute;
      inset: -40% -30%;
      background: linear-gradient(105deg, rgba(255, 255, 255, .0) 0%, rgba(255, 255, 255, .25) 50%, rgba(255, 255, 255, .0) 100%);
      transform: translateX(-120%) rotate(8deg);
      transition: transform .8s ease;
      pointer-events: none;
    }

    .btn-play-small:hover::after {
      transform: translateX(60%) rotate(8deg)
    }




    /* ====== レスポンシブ ====== */
    @media (max-width: 768px) {
      .header-inner {
        flex-wrap: wrap;
        height: auto;
        padding: 12px 0;
        gap: 10px;
      }

      .nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        gap: 6px;
        margin-left: 0;
        padding-bottom: 4px;
      }

      .nav a {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      .header-spacer {
        display: none;
      }

      .header-play-btn {
        margin-left: auto;
      }

      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
      }

      .hero {
        grid-column: auto;
        grid-row: auto
      }

      .cta {
        grid-column: auto;
        grid-row: auto
      }
    }
  </style>
</head>

        </p>
      </div>



    </main>


    <!-- フッター -->
    <div id="footer-mount" style="grid-column: 1 / -1;"></div>

  </div>

  <script>
    (async () => {
      async function loadPartial(id, path) {
        const el = document.getElementById(id);
        if (!el) return;
        const tries = ["./partials/" + path, "/partials/" + path];
        for (const url of tries) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (res.ok) { el.innerHTML = await res.text(); return; }
          } catch (e) { }
        }
        console.warn(path + " が見つかりませんでした。");
      }
      loadPartial('header-mount', 'header.html');
      loadPartial('footer-mount', 'footer.html');
    })();
  </script>

  </div>
