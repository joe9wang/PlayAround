<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/favicon.ico" rel="icon" sizes="any" />
  <link href="/favicon-32.png?v=3" rel="icon" sizes="32x32" type="image/png" />
  <link href="/favicon-16.png?v=3" rel="icon" sizes="16x16" type="image/png" />
  <link href="/apple-touch-icon.png?v=3" rel="apple-touch-icon" sizes="180x180" />
  <title>メールアドレスの確認 - BatriTable</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/site.css">

  <style>
    :root {
      --purple: #b350be;
      --green: #3cd08e;
      --bg: #f6f7fb;
      --radius: 14px;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Noto Sans JP", sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .site-header {
      background: linear-gradient(135deg, var(--purple) 0%, #8e3a9b 100%);
      color: #fff;
      padding: 0 24px;
      box-shadow: 0 4px 20px rgba(164, 10, 179, .25);
      border-radius: var(--radius);
      margin: 16px 16px 0;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 80px;
    }

    .layout {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
      flex-direction: column;
    }

    .verify-card {
      background: #fff;
      max-width: 500px;
      width: 100%;
      padding: 48px 32px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #f0fdf4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 24px;
      font-weight: 800;
      color: #0b3b2b;
    }

    p {
      line-height: 1.6;
      color: #475569;
      margin-bottom: 32px;
    }

    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--purple);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-text {
      color: #e64a5a;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- ヘッダー -->
  <div id="header-mount"></div>

  <main class="layout">
    <div class="verify-card" id="status-card">
      <div id="loading-state">
        <div class="loading-spinner"></div>
        <h2>確認中...</h2>
        <p>メールアドレスの確認を行っています。少々お待ちください。</p>
      </div>

      <div id="success-state" style="display: none;">
        <div class="icon-box">✅</div>
        <h2>確認完了！</h2>
        <p>メールアドレスの確認が正常に完了しました。<br>これで BatriTable のすべての機能をご利用いただけます。</p>
        <a href="/lobby.html" class="btn-play">ロビーへ移動する</a>
      </div>

      <div id="error-state" style="display: none;">
        <div class="icon-box">⚠️</div>
        <h2>エラーが発生しました</h2>
        <p id="error-message" class="error-text">リンクが無効か、期限が切れている可能性があります。</p>
        <a href="/login.html" class="btn" style="background:#eee; color:#333; text-decoration:none; padding:12px 24px; border-radius:12px; font-weight:700;">ログイン画面へ</a>
      </div>
    </div>

    <!-- フッター -->
    <div id="footer-mount" style="width:100%;"></div>
  </main>

  <script>
    (async () => {
      async function loadPartial(id, path) {
        const el = document.getElementById(id);
        if (!el) return;
        const res = await fetch("./partials/" + path);
        if (res.ok) el.innerHTML = await res.text();
      }
      loadPartial('header-mount', 'header.html');
      loadPartial('footer-mount', 'footer.html');
    })();
  </script>

  <script type="module" src="scripts/verify.module.js"></script>
</body>

</html>
